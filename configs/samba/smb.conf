# Global parameters
[global]
	bind interfaces only = Yes
	dns forwarder = 127.0.0.1
	interfaces = lo enp1s0
	netbios name = SRV-1
	realm = GERBER.ORG
	server role = active directory domain controller
	workgroup = GERBER
	idmap_ldb:use rfc2307 = yes
        dns forwarder = 8.8.8.8
        log level = 1 auth_audit:3 auth_json_audit:3
# auth_audit:3 — записывать каждую попытку аутентификации (Kerberos, NTLM, LDAP bind) с результатом.

	tls enabled = yes
	tls keyfile = /var/lib/samba/private/tls/srv-1.key
	tls certfile = /var/lib/samba/private/tls/srv-1.crt
	tls cafile = /var/lib/samba/private/tls/gerber-ca.crt

[sysvol]
	path = /var/lib/samba/sysvol
	read only = No

[netlogon]
	path = /var/lib/samba/sysvol/gerber.org/scripts
	read only = No
