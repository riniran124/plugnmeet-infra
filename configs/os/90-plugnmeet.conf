# Параметры ядра для plugNmeet/LiveKit (этап 5)
# Буферы UDP — рекомендация LiveKit для медиапотоков WebRTC
net.core.rmem_max = 5000000
net.core.wmem_max = 5000000
# Защита от SYN-флуда
net.ipv4.tcp_syncookies = 1
# Журнал ядра (dmesg) доступен только root
kernel.dmesg_restrict = 1
# Реже использовать подкачку: сервис реального времени
vm.swappiness = 10
