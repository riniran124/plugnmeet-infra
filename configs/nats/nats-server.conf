# NATS для plugNmeet 2.x
listen: 127.0.0.1:4222
http: 127.0.0.1:8223          # мониторинг (/healthz)

websocket {
    listen: 127.0.0.1:8222    # снаружи доступен только через nginx /nats-ws
    no_tls: true
}

jetstream {
    store_dir: /var/lib/nats/jetstream
}

accounts {
    SYS: {
        exports: [ { stream: "$SYS.ACCOUNT.PNM.>", accounts: [PNM] } ]
    }
    PNM: {
        jetstream: enabled
        imports: [ { stream: { account: SYS, subject: "$SYS.ACCOUNT.PNM.>" } } ]
        users: [ { nkey: UAY4WK3ZNSYYD5AUZ6LWUEXR436WI7LG4DPRVYQBHQJA5C6BTTWBWXAA } ]
    }
}

system_account: SYS

authorization {
    timeout: 5
    auth_callout {
        issuer: ACEBUOYUJO2XNTO2W2ZUQ4ZZDI3NLKAXCG2DJTA2BEJ5UXPBMHEZTP7F
        auth_users: [ UAY4WK3ZNSYYD5AUZ6LWUEXR436WI7LG4DPRVYQBHQJA5C6BTTWBWXAA ]
        account: PNM
        xkey: XDLOCHAZEQYLIVFHLUKETYFSAUBHJG2FHWCQHGX6QFJSVW4HIHWGYDVO
    }
}
